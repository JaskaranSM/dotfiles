# --- Typography ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Padding ---
# Adds a clean, modern breathable border inside the terminal window
window_padding_width 12
confirm_os_window_close 0

# --- Scrollback Matrix ---
scrollback_lines 5000

# --- Cursor Customization ---
cursor            #00bfa5
cursor_text_color #1e1e1e
cursor_shape      block
cursor_blink_interval 0.5

# --- Material Teal (MD2) Color Theme ---
background            #1e1e1e
foreground            #e8eaed
selection_background  #00bfa5
selection_foreground  #0b1f1b

# URL underline color when hovering
url_color             #4db6ac

# Kitty tab bar styles
active_tab_background   #00bfa5
active_tab_foreground   #0b1f1b
inactive_tab_background #2e2e2e
inactive_tab_foreground #9aa0a6
tab_bar_background      #1e1e1e

# The 16 terminal colors (Normal + Bright)

# black
color0 #2e2e2e
color8 #5f6368

# red
color1 #ef5350
color9 #ff8a80

# green
color2  #66bb6a
color10 #a5d6a7

# yellow
color3  #ffca28
color11 #ffe082

# blue
color4  #42a5f5
color12 #90caf9

# magenta
color5  #ab47bc
color13 #ce93d8

# cyan
color6  #26c6da
color14 #80deea

# white
color7  #e8eaed
color15 #ffffff

# --- Terminal Bell ---
enable_audio_bell no
window_alert_on_bell no
