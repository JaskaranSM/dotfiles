; Material Teal (MD2) - floating rounded surface, teal accents
[colors]
background     = #1e1e1e
surface        = #262626
foreground     = #e8eaed
foreground-dim = #9aa0a6
primary        = #00bfa5
primary-deep   = #009688
secondary      = #4db6ac
alert          = #ef5350
disabled       = #5f6368
success        = #66bb6a
cap            = #ffffff

[bar/main]
width = 100%
height = 30pt
offset-x = 0
offset-y = 0
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
line-color = ${colors.primary}
padding-left = 0
padding-right = 0
padding-top = 0
padding-bottom = 0
module-margin-left = 0
module-margin-right = 0
separator = "  "
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:pixelsize=11;3"

modules-left   = xworkspaces
modules-right  = bluetooth pulseaudio wlan cpu-temp cpu memory battery date systray

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[global/wm]
margin-bottom = 8

[module/systray]
type = internal/tray
format-margin = 4px
tray-spacing = 6px
tray-size = 66%

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.primary}
label-active-underline = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.foreground-dim}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-underline = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/bluetooth]
type = custom/script
exec = command -v rofi-bluetooth >/dev/null 2>&1 && rofi-bluetooth --status || true
interval = 2
click-left = rofi-bluetooth &
format-prefix = " "
format-prefix-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "   "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = " MUTED"
label-muted-foreground = ${colors.disabled}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
click-left = networkmanager_dmenu &
format-connected = <label-connected>
format-connected-prefix = "   "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid% %downspeed:min%
label-disconnected = "DISCONNECTED"
label-disconnected-foreground = ${colors.alert}

[module/cpu-temp]
type = internal/temperature
interval = 2
thermal-zone = 0
warn-temperature = 80
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %temperature-c%
format-warn = <label-warn>
format-warn-prefix = "HOT "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5
format-charging = <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.success}
label-charging = %percentage%%
format-discharging = <label-discharging>
format-discharging-prefix = " "
format-discharging-prefix-foreground = ${colors.primary}
label-discharging = %percentage%%
format-full = <label-full>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.success}
label-full = %percentage%%
format-low = <label-low>
format-low-prefix = "LOW "
format-low-prefix-foreground = ${colors.alert}
label-low = %percentage%%

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = false