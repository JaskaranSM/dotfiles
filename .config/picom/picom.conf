# --- Backend & Hardware Acceleration ---
backend = "glx";
use-damage = true;
vsync = true;

# --- Beautiful Rounded Corners ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# --- Subtle Drop Shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@"
];

# --- Smooth Animations & Fading ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.05;
fade-delta = 6;

# --- Hardware-Accelerated Dual-Kawase Blur ---
# This creates a gorgeous frosted-glass effect behind transparent windows
blur: {
  method = "dual_kawase";
  strength = 8;
  background = true;
  background-frame = false;
  background-fixed = false;
}

# Don't blur background apps where text needs to be 100% sharp
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Google-chrome'",
  "_GTK_FRAME_EXTENTS@"
];

# --- Opacity & Dimming ---
active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;

# Let web browsers and media players stay fully bright when unfocused
focus-exclude = [
  "class_g = 'Google-chrome'",
  "class_g = 'mpv'",
  "class_g = 'vlc'"
];

# --- Terminal Transparency ---
opacity-rule = [
  "88:class_g = 'kitty' && focused",
  "75:class_g = 'kitty' && !focused"
];

# --- Window Types Layout ---
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; fade = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.95; fade = true; }
  dropdown_menu = { opacity = 0.95; fade = true; }
};

# --- Window Animations (pijulius/picom fork) ---
animations = ({
    triggers = [ "open" ];
    preset = "appear";
    scale = 0.90;
    duration = 0.22;
}, {
    triggers = [ "close" ];
    preset = "disappear";
    scale = 0.92;
    duration = 0.16;
});
